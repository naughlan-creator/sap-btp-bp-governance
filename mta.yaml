_schema-version: "3.1"
ID: bp-governance
version: 1.0.0
description: "BP change-request demo on SAP BTP trial - not production"
parameters:
  enable-parallel-deployments: true

build-parameters:
  # Run `npm ci` before `mbt build` (the pipeline does). Doing it here fails on Windows,
  # because it would delete node_modules/mbt while mbt itself is running.
  before-all:
    - builder: custom
      commands:
        - npm run build

modules:
  # CAP service (Node.js). Data lives in in-memory SQLite and is reset on every restart (demo only).
  - name: bp-governance-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 1024M
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: bp-governance-auth
      - name: bp-governance-destination

  # Fiori elements app: only built here, then copied into the approuter (not deployed by itself)
  - name: bp-governance-ui
    type: html5
    path: app/changerequests
    build-parameters:
      builder: custom
      commands: []
      build-result: webapp
      supported-platforms: []

  # Standalone approuter: login via XSUAA, serves the UI, forwards /odata to the CAP service
  - name: bp-governance
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    build-parameters:
      ignore: ["default-env.json", "node_modules/"]
      requires:
        - name: bp-governance-ui
          artifacts: ["./*"]
          target-path: resources/changerequests
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: bp-governance-auth

resources:
  - name: bp-governance-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: bp-governance-${org}-${space}
        tenant-mode: dedicated

  # Holds the API_BUSINESS_PARTNER destination (created in the BTP cockpit, see README)
  - name: bp-governance-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
